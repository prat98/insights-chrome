# Hot-reload override - mount local source directories for live development
#
# Usage:
#   ./hub-dev.sh start --dev
#   ./hub-dev.sh start --remote --dev
#
# Mounts your local aap-ui source into the container so webpack
# watches for changes and hot-reloads automatically.
# The insights/ build config (webpack, node_modules) stays from the image.

services:
  aap-ui:
    environment:
      # Enable webpack polling for file watching through Podman VM mounts
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Mount all hub source code
      - ../aap-ui/frontend/hub:/workspace/aap-ui/frontend/hub
      # But override insights/ back from the image (preserves webpack config + node_modules)
      # This is done by creating a named volume that was populated from the image on first run
      - hub_insights_config:/workspace/aap-ui/frontend/hub/insights
      # Mount insights source files from local on top of the named volume
      # so that changes to these files are hot-reloaded during development
      - ../aap-ui/frontend/hub/insights/HubRoot.tsx:/workspace/aap-ui/frontend/hub/insights/HubRoot.tsx
      - ../aap-ui/frontend/hub/insights/HubInsightsApp.tsx:/workspace/aap-ui/frontend/hub/insights/HubInsightsApp.tsx
      - ../aap-ui/frontend/hub/insights/awx-stub.ts:/workspace/aap-ui/frontend/hub/insights/awx-stub.ts
      # Also mount common and framework
      - ../aap-ui/frontend/common:/workspace/aap-ui/frontend/common
      - ../aap-ui/framework:/workspace/aap-ui/framework

  # Uncomment to also hot-reload ansible-hub-ui:
  # ansible-hub-ui:
  #   volumes:
  #     - ../ansible-hub-ui/src:/workspace/ansible-hub-ui/src

  # Uncomment to also hot-reload insights-chrome:
  # insights-chrome:
  #   volumes:
  #     - ./src:/workspace/insights-chrome/src
  #     - ./config:/workspace/insights-chrome/config

volumes:
  hub_insights_config:
    name: hub_dev_insights_config
